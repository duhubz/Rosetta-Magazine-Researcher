# Rosetta Magazine Researcher - Configuration
# Paths are relative to the application root (next to the executable or app.py)

server:
  port: 18028  # 'Fl' in hex for Flatso
  dev_mode: false  # Enables Flask auto-reload and disables static/template caching

paths:
  data_dir: Magazines
  bookmarks_file: bookmarks.json
  catalog_file: catalog.json
  catalogs_dir: Catalogs
  covers_dir: Covers

catalog:
  urls:
    - https://www.gamingalexandria.com/ga-researcher/catalog.json
    - https://archive.org/download/ga-researcher-files/catalog.json

download:
  timeout_seconds: 60
  catalog_fetch_timeout: 10
  cover_fetch_timeout: 5

heartbeat:
  shutdown_after_idle_seconds: 180  # Auto-exit after no browser heartbeat for this long
  check_interval_seconds: 5

security:
  # Hosts the app is allowed to fetch catalogs/covers from (http/https only).
  # Entries starting with "*." match any subdomain.
  allowed_fetch_hosts:
    - gamingalexandria.com
    - www.gamingalexandria.com
    - archive.org
    - "*.archive.org"
