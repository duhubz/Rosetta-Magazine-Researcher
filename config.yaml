# Rosetta Magazine Researcher - Configuration
# Paths are relative to the application root (next to the executable or app.py)

server:
  port: 18028  # 'Fl' in hex for Flatso
  dev_mode: false  # Enables Flask auto-reload and disables static/template caching

paths:
  data_dir: Magazines
  bookmarks_file: bookmarks.json
  catalog_file: catalog.json
  catalogs_dir: Catalogs
  covers_dir: Covers

catalog:
  urls:
    - https://www.gamingalexandria.com/ga-researcher/catalog.json
    - https://archive.org/download/ga-researcher-files/catalog.json

download:
  timeout_seconds: 60
  catalog_fetch_timeout: 10
  cover_fetch_timeout: 5

search:
  index_file: .rosetta_index.db   # SQLite FTS5 index, stored inside the data_dir
  rebuild_on_startup: false       # if true, ignore incremental logic and full-rebuild

pdf_cache:
  max_open_documents: 2  # LRU size for open PDF handles (per-document locking)

heartbeat:
  shutdown_after_idle_seconds: 180  # Auto-exit after no browser heartbeat for this long
  check_interval_seconds: 5

security:
  # Hosts the app is allowed to fetch from (http/https only). This one list
  # gates catalog refreshes, cover images, AND magazine download sources
  # (every pdf_sources / zip_sources URL in a catalog entry).
  # Entries starting with "*." match any subdomain.
  # To trust an additional download mirror, add its hostname here, e.g.:
  #   - mirror.example.org
  allowed_fetch_hosts:
    - gamingalexandria.com
    - www.gamingalexandria.com
    - archive.org
    - "*.archive.org"
  # Advanced / trusted-catalog-only: when true, magazine/data-ZIP downloads
  # (pdf_sources / zip_sources) may fetch from ANY http/https host, skipping
  # the allowlist above. Non-http(s) schemes (file:, javascript:, ...) are
  # ALWAYS rejected. Intended for users with private archive.org mirrors in
  # network-restricted environments; leave false unless you fully trust
  # every catalog you have installed.
  allow_downloads_from_any_host: false
  # Maximum number of HTTP redirects followed per outbound fetch. Redirects
  # are followed manually and EVERY hop (including relative Location headers)
  # is re-checked against allowed_fetch_hosts and the http/https scheme rule,
  # so an allowlisted host cannot redirect the app to file:// or an internal
  # host. Fetches exceeding this many redirects are aborted.
  max_redirects: 5
